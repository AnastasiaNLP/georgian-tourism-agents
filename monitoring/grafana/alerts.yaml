groups:
  - name: travel-agent-alerts
    rules:

      - alert: HighErrorRate
        expr: |
          sum(rate(travel_agent_requests_total{status="error"}[5m]))
          /
          sum(rate(travel_agent_requests_total[5m]))
          > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate in travel agent"
          description: "More than 5% of requests are failing"

      - alert: LowConfidenceResponses
        expr: |
          histogram_quantile(
            0.5,
            sum(rate(travel_agent_request_latency_ms_bucket[5m])) by (le)
          ) > 3000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow responses detected"
